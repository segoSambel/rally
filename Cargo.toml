[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "0.7", features = ["tree-sitter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
rally-core = { path = "crates/rally-core" }
rally-ui = { path = "crates/rally-ui" }
embed-resource = "3"
# Embed bundled icons in debug builds too. Without it, rust-embed reads them from a
# compile-time host path, which a Windows exe cross-built from WSL cannot see.
rust-embed = { version = "8", features = ["debug-embed"] }
